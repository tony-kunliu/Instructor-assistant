name = "instructor-assistant"
# worker/scheduled-entry.ts wraps OpenNext's generated `.open-next/worker.js`
# (fetch unchanged) and adds a `scheduled` handler for the ACTGDS
# Integration V1 outbox retry sweep — see that file's own header comment
# and docs/integrations/actgds-instructor-assistant-v1.md.
main = "worker/scheduled-entry.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Sweeps due ACTGDS Integration V1 outbox retries every 5 minutes — a no-op
# when ACTGDS_INTEGRATION_ENABLED=false (the default; see [vars] below).
[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# The Cloudflare Access Application `aud` protecting this Worker's own
# hostname (Instructor Identity V1) — not a secret, just an identifier
# Access itself exposes in its own login redirect. Each environment has
# its own Access Application (one per hostname), hence its own aud here.
[vars]
ACCESS_AUD = "dbaecdf29cb50d215f3edbb3b260b2c85209db78728fb19e3c53c39c5d9759e3"

# ACTGDS Integration V1 (see docs/integrations/actgds-instructor-assistant-v1.md).
# Coordinated non-Production Staging <-> ACTGDS QA Integration QA (Tony
# authorized; see tony-kunliu/actgds.com Issue #3). ACTGDS_WEBHOOK_URL is
# not sensitive — the QA receiver route itself, not a credential — so it's
# a plain [vars] value here. ACTGDS_WEBHOOK_SECRET remains a Worker secret
# via `wrangler secret put`, never a plain [vars] value.
#
# RESTORED after the Retry/real hosted Cron recovery QA's deliberate
# temporary breakage (Tony-approved design, tony-kunliu/actgds.com
# Issue #3) confirmed a real retryable failure (event_id
# 31a3d3d0-09ec-43ef-b303-bd78856e0713, http_530, outbox pending,
# attempt_count 1). Real URL restored so the real hosted Cloudflare Cron
# Trigger can recover the pending event on its own — no manual replay.
ACTGDS_INTEGRATION_ENABLED = "true"
ACTGDS_INTEGRATION_ENV = "staging"
ACTGDS_WEBHOOK_URL = "https://actgds-production-baseline-qa.dsnhtcrrx4.chatgpt.site/api/integrations/instructor-assistant/events"

# Self-reference service binding required by the OpenNext Cloudflare adapter
# (used for ISR/tag-cache revalidation); the service name must match `name`.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "instructor-assistant"

# D1 binding for Instructor / Learner / Lesson storage.
#
# Created via `wrangler d1 create instructor-assistant-db` (account:
# Kunliu.work@gmail.com, region ENAM). Local development and tests never
# need this real id: `wrangler d1 migrations apply DB --local` runs
# entirely offline against Miniflare's local D1 emulation.
[[d1_databases]]
binding = "DB"
database_name = "instructor-assistant-db"
database_id = "7611cd7e-2331-4372-bbe3-86bcc093d26d"
migrations_dir = "migrations"

# Production environment — a separate Worker (its own workers.dev URL) and
# a separate, empty D1 database (never the Staging one; Tony explicitly
# asked to start Production fresh, discarding Staging's test data).
# Final routing (a custom domain such as actgds.com/instructor-assistant,
# vs. this Worker's own workers.dev URL) is still pending — see TASK.md.
[env.production]
name = "instructor-assistant-production"

[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.vars]
ACCESS_AUD = "5d77a5074b7a9436e7610db2937f4108d9fd60a97d6c9243421fb44909ce288b"
# Release B (Tony-authorized 2026-10-07): ACTGDS Receiver declared PRODUCTION
# READY (actgds.com PR #21); ACTGDS_WEBHOOK_SECRET is a Worker secret set by
# Tony. Kill switch: set back to "false" and redeploy. See
# docs/RELEASE_B_RUNBOOK.md.
ACTGDS_INTEGRATION_ENABLED = "true"
ACTGDS_INTEGRATION_ENV = "production"
# ACTGDS Production Receiver (public endpoint, not a credential).
ACTGDS_WEBHOOK_URL = "https://actgds.com/api/integrations/instructor-assistant/events"

[[env.production.services]]
binding = "WORKER_SELF_REFERENCE"
service = "instructor-assistant-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "instructor-assistant-db-production"
database_id = "b2f52cb6-e9cd-4ac4-82d9-90b1b7e75ed3"
migrations_dir = "migrations"
