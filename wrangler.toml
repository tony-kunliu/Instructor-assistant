name = "instructor-assistant"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# The Cloudflare Access Application `aud` protecting this Worker's own
# hostname (Instructor Identity V1) — not a secret, just an identifier
# Access itself exposes in its own login redirect. Each environment has
# its own Access Application (one per hostname), hence its own aud here.
[vars]
ACCESS_AUD = "dbaecdf29cb50d215f3edbb3b260b2c85209db78728fb19e3c53c39c5d9759e3"

# ACTGDS Integration V1 (see docs/integrations/actgds-instructor-assistant-v1.md).
# Disabled by default — real ACTGDS_WEBHOOK_URL/ACTGDS_WEBHOOK_SECRET are
# deliberately not set this round (no real receiver exists yet); the secret
# in particular must be set via `wrangler secret put`, never a plain [vars]
# value, when this is actually turned on.
ACTGDS_INTEGRATION_ENABLED = "false"
ACTGDS_INTEGRATION_ENV = "staging"

# Self-reference service binding required by the OpenNext Cloudflare adapter
# (used for ISR/tag-cache revalidation); the service name must match `name`.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "instructor-assistant"

# D1 binding for Instructor / Learner / Lesson storage.
#
# Created via `wrangler d1 create instructor-assistant-db` (account:
# Kunliu.work@gmail.com, region ENAM). Local development and tests never
# need this real id: `wrangler d1 migrations apply DB --local` runs
# entirely offline against Miniflare's local D1 emulation.
[[d1_databases]]
binding = "DB"
database_name = "instructor-assistant-db"
database_id = "7611cd7e-2331-4372-bbe3-86bcc093d26d"
migrations_dir = "migrations"

# Production environment — a separate Worker (its own workers.dev URL) and
# a separate, empty D1 database (never the Staging one; Tony explicitly
# asked to start Production fresh, discarding Staging's test data).
# Final routing (a custom domain such as actgds.com/instructor-assistant,
# vs. this Worker's own workers.dev URL) is still pending — see TASK.md.
[env.production]
name = "instructor-assistant-production"

[env.production.vars]
ACCESS_AUD = "5d77a5074b7a9436e7610db2937f4108d9fd60a97d6c9243421fb44909ce288b"
ACTGDS_INTEGRATION_ENABLED = "false"
ACTGDS_INTEGRATION_ENV = "production"

[[env.production.services]]
binding = "WORKER_SELF_REFERENCE"
service = "instructor-assistant-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "instructor-assistant-db-production"
database_id = "b2f52cb6-e9cd-4ac4-82d9-90b1b7e75ed3"
migrations_dir = "migrations"
