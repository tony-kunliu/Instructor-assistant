name: Browser QA

on:
  push:
    branches: ["feature/**"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/qa-browser/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-browser.yml"

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright browser
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium

      - name: Export Playwright paths
        shell: bash
        run: |
          global_root="$(npm root -g)"
          echo "NPM_GLOBAL=$global_root" >> "$GITHUB_ENV"
          browser_path="$(node -e 'const { chromium } = require(process.argv[1]); process.stdout.write(chromium.executablePath())' "$global_root/playwright")"
          echo "QA_CHROMIUM=$browser_path" >> "$GITHUB_ENV"

      - name: Run isolated browser QA
        run: bash scripts/qa-browser/run.sh
