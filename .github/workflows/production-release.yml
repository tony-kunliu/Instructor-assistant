name: Production Release

# Manual-only Production release of `main` to the Worker
# `instructor-assistant-production` (see docs/RELEASE_B_RUNBOOK.md).
# Uses the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts Edit + D1 Edit,
# this account only) so no token ever passes through chat or an agent's
# environment. Steps stop on the first failure.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to release main to Production'
        required: true
        type: string
      apply_migrations:
        description: "Apply pending D1 migrations before deploying"
        required: true
        type: boolean
        default: true

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Account id is an identifier, not a credential.
  CLOUDFLARE_ACCOUNT_ID: ff281f1a6f1aa8241b1d9bd1a22d485a
  PROD_DB: instructor-assistant-db-production
  PROD_URL: https://instructor-assistant-production.kunliu-work.workers.dev

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, tests, build)
        run: |
          npm run typecheck
          npm test
          npm run cf:build

      - name: Record rollback target and D1 restore point
        run: |
          {
            echo "## Before release"
            echo "Source commit: \`$GITHUB_SHA\`"
            echo '```'
            npx wrangler deployments list --env production | tail -n 8
            echo '```'
            echo "D1 Time Travel restore point (restore with \`wrangler d1 time-travel restore $PROD_DB --bookmark=<bookmark>\`):"
            echo '```'
            npx wrangler d1 time-travel info "$PROD_DB" --env production
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations
        if: inputs.apply_migrations
        run: |
          {
            echo "## Migrations"
            echo '```'
            npx wrangler d1 migrations list DB --env production --remote
            npx wrangler d1 migrations apply DB --env production --remote
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

      - name: Deploy
        run: npx wrangler deploy --env production

      - name: Verify deployment
        run: |
          {
            echo "## After release"
            echo '```'
            npx wrangler deployments list --env production | tail -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Behind Cloudflare Access an anonymous request is redirected (302)
          # or denied (401/403); a 5xx means the Worker itself is broken.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/")
          echo "Anonymous GET / -> HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          case "$code" in 2*|3*|401|403) ;; *) echo "Unexpected HTTP $code"; exit 1 ;; esac
