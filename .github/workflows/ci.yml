name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Project memory guard
        run: node scripts/check-project-memory.mjs

      - name: Install poppler-utils (pdftotext for PDF export tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pdftotext -v

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        # poppler-utils is installed above, so the poppler checks must run here (they skip elsewhere, e.g. Cloudflare builds).
        env:
          REQUIRE_POPPLER: "1"
        run: npm test

      - name: Build
        run: npm run build

      - name: Project memory guard (post-build)
        run: node scripts/check-project-memory.mjs
